<div class="pricing-page">
  <section class="hero">
    <h1>Choose a plan</h1>
    <div class="wallet-chip" *ngIf="wallet">
      <mat-icon>stars</mat-icon>
      <span>
        {{ wallet.creditsRemaining }} contact{{ wallet.creditsRemaining === 1 ? '' : 's' }} left
        <ng-container *ngIf="wallet.planCode"> · {{ wallet.planCode | uppercase }}</ng-container>
      </span>
    </div>
  </section>

  <div class="plan-grid" *ngIf="!loading">
    <article class="plan" *ngFor="let plan of plans" [class.popular]="plan.popular">
      <div class="badge" *ngIf="plan.popular">Most popular</div>
      <div class="plan-head">
        <h2>{{ plan.name }}</h2>
        <p class="price">₹{{ plan.amountRupees }}<span>/month</span></p>
      </div>
      <p class="contacts-line">{{ plan.contacts }} owner contacts</p>
      <button type="button" class="cta" [disabled]="!!payingCode" (click)="startCheckout(plan.code)">
        {{ payingCode === plan.code ? 'Opening…' : (payingCode ? 'Please wait…' : 'Buy ' + plan.name) }}
      </button>
    </article>
  </div>
</div>
